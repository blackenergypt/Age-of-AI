version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: age-of-ai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: securepassword123
      MONGO_INITDB_DATABASE: age_of_ai
    volumes:
      - mongodb_data:/data/db
    networks:
      - age-of-ai-network

  redis:
    image: redis:7-alpine
    container_name: age-of-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - age-of-ai-network

  mongo-express:
    image: mongo-express:latest
    container_name: age-of-ai-mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: securepassword123
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
    networks:
      - age-of-ai-network

  # Exemplos de nós de jogo (duplicáveis)
  # api / web / panel / game-server: correr localmente com pnpm por agora
  # game-server-1:
  #   build: .
  #   environment:
  #     GAME_SERVER_PORT: 3002
  #     GAME_NODE_ID: gs-1
  #   ports:
  #     - "3002:3002"

networks:
  age-of-ai-network:
    driver: bridge

volumes:
  mongodb_data:
