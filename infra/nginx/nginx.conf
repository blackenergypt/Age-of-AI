# Gateway único (dev): http://localhost
#
#   /                          → web (landing :8080)
#   /login /register /auth/*   → panel (auth)
#   /app/                      → panel (menu + jogo)
#   /api/                      → api (:3001)
#   /gs/gs-*                   → game-servers (WebSocket)

upstream api_upstream {
    server host.docker.internal:3001;
}

upstream web_upstream {
    server host.docker.internal:8080;
}

upstream panel_upstream {
    server host.docker.internal:8081;
}

upstream game_gs1 {
    server host.docker.internal:3002;
}

upstream game_gs2 {
    server host.docker.internal:3003;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;

    # --- API ---
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api_upstream/health;
        proxy_set_header Host $host;
    }

    # --- Game nodes (WebSocket) ---
    location /gs/gs-1 {
        proxy_pass http://game_gs1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /gs/gs-2 {
        proxy_pass http://game_gs2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        proxy_pass http://game_gs1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Auth na raiz (padrão tipo SaaS) ---
    # Assets relativos resolvem via <base href="/app/"> (header X-Asset-Base)
    location ~ ^/(login|register|forgot-password|reset-password)$ {
        proxy_pass http://panel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Asset-Base /app/;
    }

    location = /auth/success {
        proxy_pass http://panel_upstream/auth/success;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Asset-Base /app/;
    }

    location = /auth/failure {
        proxy_pass http://panel_upstream/auth/failure;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Asset-Base /app/;
    }

    # Compat: /app/login → /login
    location = /app/login { return 302 /login$is_args$args; }
    location = /app/register { return 302 /register$is_args$args; }
    location = /app/forgot-password { return 302 /forgot-password$is_args$args; }
    location = /app/reset-password { return 302 /reset-password$is_args$args; }
    location = /app/auth-success { return 302 /auth/success$is_args$args; }

    # --- Panel (app autenticado) ---
    location /app/ {
        proxy_pass http://panel_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /app {
        return 302 /app/menu;
    }

    # --- Landing ---
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
