# Gateway único (dev): http://localhost
#
#   /                          → web (landing, auth PT, menu/jogo/loja)
#   /entrar /registar /menu …  → web
#   /app/* (assets + redirects)→ web
#   /api/                      → api (:3001)
#   /gs/gs-*                   → game-servers (WebSocket)

upstream api_upstream {
    server host.docker.internal:3001;
}

upstream web_upstream {
    server host.docker.internal:8080;
}

upstream panel_upstream {
    server host.docker.internal:8081;
}

upstream game_gs1 {
    server host.docker.internal:3002;
}

upstream game_gs2 {
    server host.docker.internal:3003;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;

    # --- API ---
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api_upstream/health;
        proxy_set_header Host $host;
    }

    # --- Game nodes (WebSocket) ---
    location /gs/gs-1 {
        proxy_pass http://game_gs1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /gs/gs-2 {
        proxy_pass http://game_gs2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        proxy_pass http://game_gs1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Tudo o resto (páginas + assets /app/*) → Next.js ---
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
