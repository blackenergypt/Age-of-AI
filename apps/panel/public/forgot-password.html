<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha — Age of AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="runtime-config.js"></script>
    <script src="js/paths.js"></script>
    <script src="js/session-fix.js"></script>
</head>
<body class="auth-page">
    <audio id="background-music" loop preload="auto">
        <source src="audio/background-music.wav" type="audio/wav">
    </audio>

    <div id="game-container">
        <div id="background-image" aria-hidden="true"></div>

        <div class="screen">
            <div class="auth-shell">
                <div class="auth-brand-bar">
                    <a href="/">Age of AI</a>
                    <button type="button" id="toggle-sound" class="auth-sound" aria-label="Alternar som">
                        <span id="sound-icon">♪</span>
                    </button>
                </div>

                <div class="auth-container">
                    <div class="auth-header">
                        <h1 class="game-title">Age of AI</h1>
                        <p class="tagline">Recuperar senha</p>
                    </div>

                    <form id="forgotPasswordForm" class="auth-form">
                        <div class="auth-message" id="forgotPasswordMessage"></div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required autocomplete="email" placeholder="email da conta">
                        </div>

                        <div class="form-group">
                            <button type="submit" class="primary-button auth-submit">Enviar link</button>
                        </div>

                        <div class="auth-links">
                            <p><a href="/login">Voltar ao login</a></p>
                        </div>
                    </form>

                    <div class="back-to-home">
                        <a href="/" class="secondary-button">Voltar à página inicial</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/sound-control.js"></script>
    <script>
        document.getElementById('forgotPasswordForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const messageElement = document.getElementById('forgotPasswordMessage');
            if (!messageElement) return;

            const api = typeof getApiBase === 'function' ? getApiBase() : '';
            try {
                messageElement.textContent = 'A enviar…';
                messageElement.className = 'auth-message';
                messageElement.style.display = 'block';

                const response = await fetch(`${api}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (response.ok) {
                    messageElement.textContent = data.message || 'Link enviado. Verifica o teu email.';
                    messageElement.className = 'auth-message success';
                    e.target.reset();
                } else {
                    messageElement.textContent = data.message || 'Erro ao enviar link';
                    messageElement.className = 'auth-message error';
                }
            } catch (error) {
                console.error(error);
                messageElement.textContent = 'Erro ao ligar ao servidor.';
                messageElement.className = 'auth-message error';
            }
        });
    </script>
</body>
</html>
