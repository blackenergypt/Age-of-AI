<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação — Age of AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="runtime-config.js"></script>
    <script src="js/paths.js"></script>
</head>
<body class="auth-page">
    <div id="game-container">
        <div id="background-image" aria-hidden="true"></div>
        <div class="screen">
            <div class="auth-shell">
                <div class="auth-brand-bar">
                    <a href="/">Age of AI</a>
                </div>
                <div class="auth-container" style="text-align:center">
                    <div class="auth-header" style="text-align:center">
                        <h1 class="game-title">Age of AI</h1>
                        <p class="tagline" id="message">A concluir autenticação…</p>
                    </div>
                    <div class="auth-loader" aria-hidden="true"></div>
                </div>
            </div>
        </div>
    </div>
    <style>
        .auth-loader {
            width: 2.5rem;
            height: 2.5rem;
            margin: 1.5rem auto 0;
            border: 2px solid rgba(212, 180, 90, 0.25);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: auth-spin 0.8s linear infinite;
        }
        @keyframes auth-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        function getUrlParams() {
            const params = {};
            const queryString = window.location.search.substring(1);
            queryString.split('&').forEach((pair) => {
                const [k, v] = pair.split('=');
                if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
            });
            return params;
        }

        window.onload = function () {
            const params = getUrlParams();
            const message = document.getElementById('message');
            const go = (path) => {
                window.location.href = typeof agePath === 'function' ? agePath(path) : path;
            };

            if (params.token && params.user) {
                try {
                    localStorage.setItem('authToken', params.token);
                    localStorage.setItem('user', params.user);
                    message.textContent = 'Autenticação concluída. A redirecionar…';
                    setTimeout(() => go('/menu'), 1200);
                } catch (error) {
                    console.error(error);
                    message.textContent = 'Erro ao guardar a sessão.';
                    setTimeout(() => { window.location.href = '/login'; }, 2500);
                }
            } else {
                message.textContent = 'Dados de autenticação inválidos.';
                setTimeout(() => { window.location.href = '/login'; }, 2500);
            }
        };
    </script>
</body>
</html>
