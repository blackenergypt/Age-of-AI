<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha — Age of AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="runtime-config.js"></script>
    <script src="js/paths.js"></script>
    <script src="js/session-fix.js"></script>
</head>
<body class="auth-page">
    <audio id="background-music" loop preload="auto">
        <source src="audio/background-music.wav" type="audio/wav">
    </audio>

    <div id="game-container">
        <div id="background-image" aria-hidden="true"></div>

        <div class="screen">
            <div class="auth-shell">
                <div class="auth-brand-bar">
                    <a href="/">Age of AI</a>
                    <button type="button" id="toggle-sound" class="auth-sound" aria-label="Alternar som">
                        <span id="sound-icon">♪</span>
                    </button>
                </div>

                <div class="auth-container">
                    <div class="auth-header">
                        <h1 class="game-title">Age of AI</h1>
                        <p class="tagline">Nova senha</p>
                    </div>

                    <form id="resetPasswordForm" class="auth-form">
                        <div class="auth-message" id="resetPasswordMessage"></div>
                        <input type="hidden" id="token" name="token">

                        <div class="form-group">
                            <label for="password">Nova senha</label>
                            <div class="password-input">
                                <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="••••••••">
                                <i class="toggle-password fas fa-eye" data-target="password" aria-hidden="true"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirmar senha</label>
                            <div class="password-input">
                                <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="••••••••">
                                <i class="toggle-password fas fa-eye" data-target="confirmPassword" aria-hidden="true"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <button type="submit" class="primary-button auth-submit">Guardar senha</button>
                        </div>

                        <div class="auth-links">
                            <p><a href="/login">Voltar ao login</a></p>
                        </div>
                    </form>

                    <div class="back-to-home">
                        <a href="/" class="secondary-button">Voltar à página inicial</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/sound-control.js"></script>
    <script>
        document.querySelectorAll('.toggle-password').forEach((button) => {
            button.addEventListener('click', function () {
                const passwordInput = document.getElementById(this.getAttribute('data-target'));
                if (!passwordInput) return;
                const show = passwordInput.type === 'password';
                passwordInput.type = show ? 'text' : 'password';
                this.classList.toggle('fa-eye', !show);
                this.classList.toggle('fa-eye-slash', show);
            });
        });

        const token = new URLSearchParams(window.location.search).get('token');
        const tokenInput = document.getElementById('token');
        if (tokenInput && token) tokenInput.value = token;

        document.getElementById('resetPasswordForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageElement = document.getElementById('resetPasswordMessage');
            const api = typeof getApiBase === 'function' ? getApiBase() : '';

            if (!messageElement) return;
            if (password !== confirmPassword) {
                messageElement.textContent = 'As senhas não coincidem';
                messageElement.className = 'auth-message error';
                return;
            }

            try {
                messageElement.textContent = 'A guardar…';
                messageElement.className = 'auth-message';
                messageElement.style.display = 'block';

                const response = await fetch(`${api}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: document.getElementById('token').value, password })
                });
                const data = await response.json();

                if (response.ok) {
                    messageElement.textContent = data.message || 'Senha redefinida.';
                    messageElement.className = 'auth-message success';
                    setTimeout(() => { window.location.href = '/login?reset=true'; }, 2000);
                } else {
                    messageElement.textContent = data.message || 'Erro ao redefinir senha';
                    messageElement.className = 'auth-message error';
                }
            } catch (error) {
                console.error(error);
                messageElement.textContent = 'Erro ao ligar ao servidor.';
                messageElement.className = 'auth-message error';
            }
        });
    </script>
</body>
</html>
