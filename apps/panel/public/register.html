<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — Age of AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="runtime-config.js"></script>
    <script src="js/paths.js"></script>
    <script src="js/session-fix.js"></script>
</head>
<body class="auth-page">
    <audio id="background-music" loop preload="auto">
        <source src="audio/background-music.wav" type="audio/wav">
    </audio>

    <div id="game-container">
        <div id="background-image" aria-hidden="true"></div>

        <div class="screen">
            <div class="auth-shell register-shell">
                <div class="auth-brand-bar">
                    <a href="/">Age of AI</a>
                    <button type="button" id="toggle-sound" class="auth-sound" aria-label="Alternar som">
                        <span id="sound-icon">♪</span>
                    </button>
                </div>

                <div class="auth-container register-container">
                    <div class="auth-header">
                        <h1 class="game-title">Age of AI</h1>
                        <p class="tagline">Cria a tua conta</p>
                    </div>

                    <form id="registerForm" class="auth-form">
                        <div class="auth-message" id="registerMessage"></div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="nickname">Nickname</label>
                                <input type="text" id="nickname" name="nickname" required autocomplete="username" placeholder="no jogo">
                            </div>
                            <div class="form-group">
                                <label for="name">Nome</label>
                                <input type="text" id="name" name="name" required autocomplete="name" placeholder="nome completo">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required autocomplete="email" placeholder="o teu email">
                        </div>

                        <div class="form-group">
                            <label for="phone">Telefone <span style="opacity:.6;text-transform:none;letter-spacing:0;font-weight:400">(opcional)</span></label>
                            <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+351…">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="password">Senha</label>
                                <div class="password-input">
                                    <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="••••••••">
                                    <i class="toggle-password fas fa-eye" data-target="password" aria-hidden="true"></i>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">Confirmar</label>
                                <div class="password-input">
                                    <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="••••••••">
                                    <i class="toggle-password fas fa-eye" data-target="confirmPassword" aria-hidden="true"></i>
                                </div>
                            </div>
                        </div>

                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="acceptedTerms" name="acceptedTerms" required>
                            <label for="acceptedTerms">Aceito os <a href="/terms" target="_blank" rel="noopener">Termos de Uso e Privacidade</a></label>
                        </div>

                        <div class="form-group">
                            <button type="submit" class="primary-button auth-submit">Criar conta</button>
                        </div>

                        <div class="auth-links">
                            <p>Já tens conta? <a href="/login">Entrar</a></p>
                        </div>
                    </form>

                    <div class="social-login">
                        <p>Ou regista-te com</p>
                        <div class="social-buttons">
                            <a href="/api/auth/google" class="social-btn google-btn" aria-label="Registrar com Google">
                                <i class="fab fa-google"></i>
                                <span class="tooltip">Google</span>
                            </a>
                            <a href="/api/auth/facebook" class="social-btn facebook-btn" aria-label="Registrar com Facebook">
                                <i class="fab fa-facebook-f"></i>
                                <span class="tooltip">Facebook</span>
                            </a>
                            <a href="/api/auth/twitter" class="social-btn twitter-btn" aria-label="Registrar com X">
                                <i class="fa-brands fa-x-twitter"></i>
                                <span class="tooltip">X</span>
                            </a>
                            <a href="/api/auth/discord" class="social-btn discord-btn" aria-label="Registrar com Discord">
                                <i class="fab fa-discord"></i>
                                <span class="tooltip">Discord</span>
                            </a>
                        </div>
                    </div>

                    <div class="back-to-home">
                        <a href="/" class="secondary-button">Voltar à página inicial</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/sound-control.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.querySelectorAll('.toggle-password').forEach((button) => {
            button.addEventListener('click', function () {
                const passwordInput = document.getElementById(this.getAttribute('data-target'));
                if (!passwordInput) return;
                const show = passwordInput.type === 'password';
                passwordInput.type = show ? 'text' : 'password';
                this.classList.toggle('fa-eye', !show);
                this.classList.toggle('fa-eye-slash', show);
            });
        });

        document.querySelectorAll('.social-btn').forEach((a) => {
            const path = a.getAttribute('href') || '';
            if (path.startsWith('/api/') && typeof getApiBase === 'function') {
                a.href = getApiBase() + path;
            }
        });
    </script>
</body>
</html>
